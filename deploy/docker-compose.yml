# AgentTeams Dashboard — standalone docker compose (D5)
#
# Standalone mode: the Dashboard connects to an EXISTING AgentTeams
# controller. Point AGENTTEAMS_CONTROLLER_URL at your controller
# (host reachable from this container) and provide the storage/
# Matrix credentials the installer would normally auto-detect.
#
#   cp deploy/docker-compose.yml docker-compose.yml
#   # edit the environment block below, then:
#   docker compose up -d
#
# Embedded mode (dashboard installed by agentteams-install.sh) does
# not use this file — the installer manages the container lifecycle.

services:
  dashboard:
    image: ghcr.io/agentteams-group/agentteams-dashboard:latest
    container_name: agentteams-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - agentteams-dashboard-data:/data/agentteams-dashboard
    labels:
      # Watchtower scope: only this container is auto-updated.
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # --- controller ---
      AGENTTEAMS_CONTROLLER_URL: "http://agentteams-controller:8080"
      # --- storage (detection chain: FS_* -> MINIO_* -> RUSTFS_*) ---
      AGENTTEAMS_FS_ENDPOINT: "http://agentteams-controller:9000"
      AGENTTEAMS_FS_BUCKET: "agentteams-storage"
      AGENTTEAMS_FS_ACCESS_KEY: "change-me"
      AGENTTEAMS_FS_SECRET_KEY: "change-me"
      # --- matrix ---
      NEXT_PUBLIC_MATRIX_API_URL: "https://matrix.example.org"
      # --- optional: AI gateway (model alias routing) ---
      # AGENTTEAMS_AI_GATEWAY_URL: "http://higress-gateway:8080"
      # AGENTTEAMS_AI_GATEWAY_ADMIN_URL: "http://higress-console:8081"
      # --- session persistence ---
      # Standalone auto-generates and persists the session secret on
      # first boot (0600 under /data/agentteams-dashboard). Pin it with:
      # DASHBOARD_SESSION_SECRET: "64-hex-chars-min-32-bytes"
      # --- container self-update (设置 → 更新 → 更新容器) ---
      # The page button POSTs /api/self-update (admin-gated), which triggers
      # the updater sidecar below. Put the shared token in a .env file next
      # to this compose file:  WATCHTOWER_HTTP_API_TOKEN=<random-hex>
      DASHBOARD_UPDATER_URL: "http://updater:8080"
      DASHBOARD_UPDATER_TOKEN: "${WATCHTOWER_HTTP_API_TOKEN:?create .env with WATCHTOWER_HTTP_API_TOKEN=<random-hex>}"
      # --- optional: read-only demo hardening (D5) ---
      # Serve behind a reverse proxy that rate-limits and, for public
      # demos, restrict to the observer account (session level 1).

  # Container self-updater (设置 → 更新 → 更新容器). Holds the docker
  # socket — host-root-equivalent — so the blast radius is contained:
  # --label-enable limits it to the labeled dashboard container, the HTTP
  # API requires the shared bearer token, and the port stays internal
  # (no host mapping). Runs on :latest so digest comparison detects new
  # images; roll back by pinning the dashboard image to a version tag.
  # Private registry? Give watchtower pull credentials via
  # WATCHTOWER_REGISTRY_AUTH env or a mounted docker config.json.
  updater:
    image: containrrr/watchtower
    container_name: agentteams-dashboard-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >-
      --http-api-update
      --http-api-periodic-polls
      --interval 21600
      --http-api-token ${WATCHTOWER_HTTP_API_TOKEN:?create .env with WATCHTOWER_HTTP_API_TOKEN=<random-hex>}
      --label-enable
      --cleanup

volumes:
  agentteams-dashboard-data:
