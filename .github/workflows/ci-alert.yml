name: CI Failure Alert

# A10 (task 5): CI 失败时自动开/更新告警 issue——GitHub 默认只通知触发
# actor，推送到 main 的失败需要显式告警才不会静默过夜。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  alert:
    name: Open an issue when CI fails on main
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    timeout-minutes: 5
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TITLE="CI 于 main 失败：${SHA:0:8}"
          BODY="CI 在 main 上失败（head ${SHA:0:8}）。
          失败运行：${RUN_URL}
          请优先修复；修复合入后本 issue 可关闭（下次失败会新开）。"
          existing=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number' || true)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "仍失败：${RUN_URL}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}"
          fi
