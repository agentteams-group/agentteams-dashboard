name: Publish Dashboard Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (for example, v0.2.0)"
        required: true
        type: string

concurrency:
  group: dashboard-image-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      value: ${{ steps.version.outputs.value }}
      source_tree: ${{ steps.version.outputs.source_tree }}
      ready: ${{ steps.existing.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check existing source and architectures
        id: existing
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SOURCE_TREE: ${{ steps.version.outputs.source_tree }}
        run: |
          node scripts/check-published-image.mjs \
            "$REGISTRY/$REPO/agentteams-dashboard:$VERSION" "$SOURCE_TREE"
      - name: Reuse summary
        if: steps.existing.outputs.ready == 'true'
        run: echo 'Reused the existing amd64/arm64 image with the exact source tree; build and push skipped.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and push ${{ matrix.arch }} image
    needs: version
    if: needs.version.outputs.ready != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/agentteams-dashboard:${{ needs.version.outputs.value }}-${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=
            DASHBOARD_BUILD_ID=${{ needs.version.outputs.value }}
          cache-from: type=gha,scope=dashboard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ matrix.arch }},ignore-error=true,timeout=2m

  merge:
    name: Publish multi-arch manifest
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Merge platform images
        run: |
          make push-manifest \
            SOURCE_TREE="${{ needs.version.outputs.source_tree }}" \
            VERSION="${{ needs.version.outputs.value }}" \
            REGISTRY="${{ env.REGISTRY }}" \
            REPO="${{ env.REPO }}"

      - name: Publish summary
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO }}/agentteams-dashboard:${VERSION}"
          echo "### Dashboard image published" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: \`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Platforms: \`linux/amd64, linux/arm64\`" >> "${GITHUB_STEP_SUMMARY}"
