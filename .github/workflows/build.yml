name: Recover Dashboard AMD64 image transport
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
jobs:
  transport:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb6964010689a45a892b865884dcc8d473a3fd01
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Restore already native-built AMD64 layers and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/agentteams/agentteams-dashboard:v1.4.2-rc.1-recovered-amd64
          build-args: |
            NEXT_PUBLIC_BASE_PATH=
            DASHBOARD_BUILD_ID=v1.4.2-rc.1
          cache-from: type=gha,scope=dashboard-amd64
  verify:
    needs: transport
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Verify exact image on native AMD64
        run: |
          image="$REGISTRY/agentteams/agentteams-dashboard:v1.4.2-rc.1-recovered-amd64"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          image="${image%:*}@$digest"
          timeout 600 docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run -d --name dashboard-verify -p 127.0.0.1:3000:3000 "$image"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/tmp/home; then break; fi
            sleep 2
          done
          grep -q 'AgentTeams' /tmp/home
          echo "$image native AMD64 HTTP passed" >> "$GITHUB_STEP_SUMMARY"
