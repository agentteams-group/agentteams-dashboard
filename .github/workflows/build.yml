name: Publish Dashboard Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (for example, v0.2.0)"
        required: true
        type: string

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "value=${VERSION}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build and push ${{ matrix.arch }} image
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        run: |
          make push-platform \
            ARCH="${{ matrix.arch }}" \
            VERSION="${{ needs.version.outputs.value }}" \
            REGISTRY="${{ env.REGISTRY }}" \
            REPO="${{ env.REPO }}" \
            DOCKER_BUILD_ARGS="--build-arg NEXT_PUBLIC_BASE_PATH= --build-arg DASHBOARD_BUILD_ID=${{ needs.version.outputs.value }}"

  merge:
    name: Publish multi-arch manifest
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Merge platform images
        run: |
          make push-manifest \
            VERSION="${{ needs.version.outputs.value }}" \
            REGISTRY="${{ env.REGISTRY }}" \
            REPO="${{ env.REPO }}"

      - name: Publish summary
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO }}/agentteams-dashboard:${VERSION}"
          echo "### Dashboard image published" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: \`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Platforms: \`linux/amd64, linux/arm64\`" >> "${GITHUB_STEP_SUMMARY}"
